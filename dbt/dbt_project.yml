name: grid_project
version: '0.1.0'
config-version: 2
profile: grid_project
flags:
  send_anonymous_usage_stats: false
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
# S5 dialect pass: on the postgres target, install the exception-safe
# plpgsql helpers (grid_dbt_helpers.*) that macros/cross_dialect.sql's
# postgres__ macros call. No-op on the DuckDB target.
on-run-start:
  - "{{ install_pg_helpers() }}"
models:
  grid_project:
    cleaned:
      +schema: cleaned
      +materialized: view
    serving:
      +schema: serving
      +materialized: view
    marts:
      +schema: marts
      +materialized: view
vars:
  expected_fuels: ['COL', 'NG', 'NUC', 'OIL', 'OTH', 'SUN', 'WAT', 'WND']
