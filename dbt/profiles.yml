grid_project:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('GRID_DATABASE') }}"
      schema: main
      threads: 1
      settings:
        TimeZone: UTC
    # S5 deployment target (PLAN decision 4): Supabase hosted Postgres via
    # dbt-postgres. Credentials come only from the environment — in GitHub
    # Actions these are repo secrets (SUPABASE_DB_*); never put values here.
    # Connection guidance: use the Supabase *direct* connection or the
    # *session* pooler (port 5432). Do NOT use the transaction pooler
    # (port 6543): dbt-postgres relies on session state. With the pooler the
    # user is "postgres.<project-ref>"; with the direct connection it is
    # "postgres". SUPABASE_DB_NAME is the project database name ("postgres").
    supabase:
      type: postgres
      host: "{{ env_var('SUPABASE_DB_HOST') }}"
      port: "{{ env_var('SUPABASE_DB_PORT', '5432') | int }}"
      user: "{{ env_var('SUPABASE_DB_USER') }}"
      password: "{{ env_var('SUPABASE_DB_PASSWORD') }}"
      dbname: "{{ env_var('SUPABASE_DB_NAME', 'postgres') }}"
      schema: public
      threads: 4
      connect_timeout: 30
      keepalives_idle: 0
